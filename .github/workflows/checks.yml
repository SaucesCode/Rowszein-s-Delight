# The checks we run by hand before calling work done, on every push and pull request.
# Nothing here deploys, reads backend/.env or connects to a real database.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django system check
        working-directory: backend
        run: python manage.py check --settings=backend.test_settings
      - name: No model change is missing a migration
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --settings=backend.test_settings
      - name: Tests
        working-directory: backend
        run: python manage.py test --settings=backend.test_settings

  backend-postgres:
    name: Backend tests (throwaway PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Runner's own tests
        run: python scripts/test_test_postgres.py
      - name: Full suite on PostgreSQL 17
        run: python scripts/test_postgres.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc -b
      - name: Lint
        working-directory: frontend
        run: npx eslint .
      - name: Build
        working-directory: frontend
        run: npx vite build
      - name: Regression scripts
        run: |
          for f in tests/regression/*.mjs; do
            echo "::group::$f"
            node "$f" || { echo "::error::$f failed"; exit 1; }
            echo "::endgroup::"
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python packages
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm packages
        working-directory: frontend
        run: npm audit --audit-level=high
